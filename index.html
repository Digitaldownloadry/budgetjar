
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BudgetJar</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="app" title="BudgetJar"></iframe>
  <script>
    const app = document.getElementById("app");

    function loadLayout() {
      const width = window.innerWidth;

      if (width < 768) {
        app.src = "mobile/code.html";
      } else if (width < 1024) {
        app.src = "tablet/code.html";
      } else {
        app.src = "desktop/code.html";
      }
    }

    loadLayout();
    window.addEventListener("resize", loadLayout);
  </script>
</body>
</html>
